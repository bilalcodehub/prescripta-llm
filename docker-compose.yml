version: "3.8"

services:
  vllm:
    build: .
    container_name: prescripta-llm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - ./config:/config
    ports:
      - "11007:11007"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.5-35B-A3B-AWQ
      --served-model-name prescripta-judge
      --host 0.0.0.0
      --port 11007
      --max-model-len 16384
      --gpu-memory-utilization 0.92
      --dtype auto
      --trust-remote-code
      --download-dir /models
      --enable-reasoning
      --reasoning-parser deepseek_r1
    restart: unless-stopped
