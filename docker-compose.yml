version: "3.8"

services:
  vllm:
    build: .
    container_name: prescripta-llm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1,2,3
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - ./config:/config
    ports:
      - "11007:11007"
    ipc: host
    command: >
      --model Qwen/Qwen3.5-35B-A3B
      --served-model-name prescripta-judge
      --host 0.0.0.0
      --port 11007
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --tensor-parallel-size 4
      --max-num-seqs 128
      --enable-chunked-prefill
      --download-dir /models
      --trust-remote-code
    restart: unless-stopped
